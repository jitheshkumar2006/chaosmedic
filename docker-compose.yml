version: '3.8'

services:
  demo-app:
    build:
      context: ./demo-app
      dockerfile: Dockerfile
    container_name: chaosmedic-demo-app
    ports:
      - "8001:8001"
    environment:
      - PORT=8001
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: chaosmedic-backend
    ports:
      - "8000:8000"
    environment:
      - DEMO_APP_URL=http://demo-app:8001
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_MODEL=${LLM_MODEL:-gemini-2.0-flash}
      - LLM_PROVIDER=${LLM_PROVIDER:-google}
    depends_on:
      - demo-app
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: chaosmedic-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped
